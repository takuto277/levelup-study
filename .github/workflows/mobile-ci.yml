# KMP shared モジュールの Android ターゲットを Linux でコンパイル検証する
name: Mobile — CI

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mobile

jobs:
  compile-shared-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: local.properties (sdk.dir + api.key)
        run: |
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "api.key=ci-placeholder-not-for-production"
          } > local.properties

      - name: Gradle compile (:shared Android)
        env:
          GRADLE_OPTS: -Xmx3g -Dorg.gradle.daemon=false -Dorg.gradle.configuration-cache=false
        run: chmod +x gradlew && ./gradlew :shared:compileDebugKotlinAndroid --no-daemon --no-configuration-cache --stacktrace
