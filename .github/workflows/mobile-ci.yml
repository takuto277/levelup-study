# KMP shared モジュールの Android ターゲットを Linux でコンパイル検証する
name: Mobile — CI

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile-shared-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: local.properties (sdk.dir + api.key)
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK" || { echo "Android SDK not found" >&2; exit 1; }
          {
            echo "sdk.dir=$SDK"
            echo "api.key=ci-placeholder-not-for-production"
          } > local.properties

      - name: Gradle compile (:shared Android)
        env:
          GRADLE_OPTS: -Xmx3g -Dorg.gradle.daemon=false -Dorg.gradle.configuration-cache=false
          LEVELUP_API_KEY: ci-placeholder-not-for-production
        run: ./gradlew :shared:compileDebugKotlinAndroid --no-daemon --stacktrace
