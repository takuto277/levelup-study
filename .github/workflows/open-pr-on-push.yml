# main 以外への push で、まだ PR が無ければドラフト PR を自動作成する
name: Auto open draft PR

on:
  push:
    branches-ignore:
      - main
      - master
      - "dependabot/**"

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create draft PR if none exists
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          count="$(gh pr list --repo "$REPO" --head "$BRANCH_NAME" --state open --json number --jq 'length')"
          if [ "$count" != "0" ]; then
            echo "Open PR already exists for head=$BRANCH_NAME — skipping."
            exit 0
          fi

          branch_slug="${BRANCH_NAME#feat/}"
          issue_body_file="docs/tasks/issue-body-${branch_slug}.md"
          issue_ref=""
          if [ -f "$issue_body_file" ]; then
            issue_num="$(gh issue list --repo "$REPO" --state open --json number,title --jq \
              ".[] | select(.title | test(\"${branch_slug//-/[- ]}\")) | .number" | head -1 || true)"
            if [ -n "$issue_num" ]; then
              issue_ref="Fixes #${issue_num}"
            fi
          fi

          title="[auto] ${BRANCH_NAME//\//_}"
          if [ -n "$issue_ref" ]; then
            title="feat: ${branch_slug//-/ } (#${issue_num})"
          fi

          {
            [ -n "$issue_ref" ] && echo "$issue_ref"
            echo ""
            echo "このドラフト PR は \`$BRANCH_NAME\` への push から [Actions run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) で自動作成されました。"
            echo ""
            echo "## Summary"
            echo "- ブランチ \`$BRANCH_NAME\` の変更"
            echo ""
            echo "## Test plan"
            echo "- [ ] CI green"
          } > /tmp/pr-body.md

          gh pr create --repo "$REPO" \
            --base main \
            --head "$BRANCH_NAME" \
            --draft \
            --title "$title" \
            --body-file /tmp/pr-body.md

          echo "Draft PR created for $BRANCH_NAME"
