# main 以外への push で、まだ PR が無ければドラフト PR を自動作成する
name: Auto open draft PR

on:
  push:
    branches-ignore:
      - main
      - master
      - "dependabot/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create draft PR if none exists
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const branch = context.ref.replace('refs/heads/', '');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = context.payload.repository.default_branch || 'main';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const { data: existing } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${branch}`,
              state: 'open',
              per_page: 10,
            });
            if (existing.length > 0) {
              core.info(`Open PR already exists: #${existing[0].number}`);
              return;
            }

            const branchSlug = branch.includes('/')
              ? branch.split('/').slice(1).join('-')
              : branch;
            const issueBodyPath = `docs/tasks/issue-body-${branchSlug}.md`;

            let issueNum = null;
            if (fs.existsSync(issueBodyPath)) {
              const issueBody = fs.readFileSync(issueBodyPath, 'utf8');
              const titleMatch = issueBody.match(/^#\s+Issue:\s*(.+)/m);
              const searchTitle = titleMatch ? titleMatch[1].trim() : branchSlug.replace(/-/g, ' ');
              const { data: issues } = await github.rest.issues.listForRepo({
                owner, repo, state: 'open', per_page: 100,
              });
              const hit = issues.find(
                (i) => !i.pull_request && (i.title.includes(searchTitle) || i.title.includes(branchSlug.replace(/-/g, ' '))),
              );
              if (hit) issueNum = hit.number;
            }

            const templatePath = '.github/pull_request_template.md';
            let template = fs.existsSync(templatePath)
              ? fs.readFileSync(templatePath, 'utf8')
              : '## 概要\n\n-';

            template = template.replace(
              'Fixes #<!-- イシュー番号。例: Fixes #2 -->',
              issueNum ? `Fixes #${issueNum}` : 'Fixes #<!-- イシュー番号を記入 -->',
            );

            const title = issueNum
              ? `feat: ${branchSlug.replace(/-/g, ' ')} (#${issueNum})`
              : `[auto] ${branch.replace(/\//g, '_')}`;

            const body = [
              `<!-- このドラフト PR は \`${branch}\` への push から [Actions run](${runUrl}) で自動作成されました。 -->`,
              '',
              template,
            ].join('\n');

            const { data: pr } = await github.rest.pulls.create({
              owner,
              repo,
              title,
              head: branch,
              base,
              body,
              draft: true,
            });
            core.info(`Created draft PR #${pr.number}: ${pr.html_url}`);
