# main 以外への push で Issue 連携付き PR を自動作成・同期
name: Auto open PR

on:
  push:
    branches-ignore:
      - main
      - master
      - "dependabot/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or sync PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');

            const branch = context.ref.replace('refs/heads/', '');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = context.payload.repository.default_branch || 'main';
            const headSha = context.sha;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const repoUrl = `${context.serverUrl}/${owner}/${repo}`;

            const branchSlug = branch.includes('/')
              ? branch.split('/').slice(1).join('-')
              : branch;
            const issueBodyPath = `docs/tasks/issue-body-${branchSlug}.md`;

            const extractSection = (md, heading) => {
              const re = new RegExp(`##\\s+${heading}\\s*\\n([\\s\\S]*?)(?=\\n##\\s|$)`, 'i');
              const m = md.match(re);
              return m ? m[1].trim() : '';
            };

            const stripIssueTitleLine = (md) =>
              md.replace(/^#\s+Issue:\s*.+\n?/m, '').trim();

            let issueNum = null;
            let issueTitle = `feat: ${branchSlug.replace(/-/g, ' ')}`;
            let issueBodyMd = '';
            let issueHtmlUrl = '';

            if (fs.existsSync(issueBodyPath)) {
              issueBodyMd = fs.readFileSync(issueBodyPath, 'utf8');
              const titleMatch = issueBodyMd.match(/^#\s+Issue:\s*(.+)/m);
              if (titleMatch) issueTitle = titleMatch[1].trim();
              const searchTitle = titleMatch ? titleMatch[1].trim() : branchSlug.replace(/-/g, ' ');

              const { data: issues } = await github.rest.issues.listForRepo({
                owner, repo, state: 'all', per_page: 100,
              });
              let hit = issues.find(
                (i) => !i.pull_request && (
                  i.title === issueTitle
                  || i.title.includes(searchTitle)
                  || i.title.includes(branchSlug.replace(/-/g, ' '))
                ),
              );

              if (!hit) {
                const bodyForIssue = stripIssueTitleLine(issueBodyMd);
                const { data: created } = await github.rest.issues.create({
                  owner,
                  repo,
                  title: issueTitle,
                  body: bodyForIssue + `\n\n---\n_ブランチ \`${branch}\` から Auto open PR により起票_`,
                  labels: ['enhancement'],
                });
                hit = created;
                core.info(`Created issue #${created.number}: ${created.html_url}`);
              }

              issueNum = hit.number;
              issueHtmlUrl = hit.html_url || `${repoUrl}/issues/${issueNum}`;
            }

            let changedFiles = [];
            try {
              const { data: compare } = await github.rest.repos.compareCommits({
                owner,
                repo,
                base: `${base}...${headSha}`,
              });
              changedFiles = (compare.files || []).map(
                (f) => `- \`${f.filename}\` (${f.status}, +${f.additions}/-${f.deletions})`,
              );
            } catch (err) {
              core.warning(`compareCommits failed: ${err.message}`);
              try {
                const names = execSync(`git diff --name-status origin/${base}...HEAD`, { encoding: 'utf8' })
                  .trim()
                  .split('\n')
                  .filter(Boolean)
                  .slice(0, 40)
                  .map((line) => {
                    const [status, ...rest] = line.split('\t');
                    return `- \`${rest.join('\t')}\` (${status})`;
                  });
                changedFiles = names;
              } catch (_) { /* ignore */ }
            }

            const taskPlanGlob = fs.readdirSync('docs/tasks').filter(
              (f) => f.endsWith(`-${branchSlug}.md`) && !f.startsWith('issue-body-'),
            );
            const taskPlanPath = taskPlanGlob.length
              ? `docs/tasks/${taskPlanGlob.sort().reverse()[0]}`
              : null;

            let sectionWhy = '- （issue-body 未配置）';
            let sectionWhat = changedFiles.length
              ? changedFiles.slice(0, 35).join('\n')
              : '- （変更ファイルを取得できませんでした）';
            let sectionEffect = '-';

            if (issueBodyMd) {
              const bg = extractSection(issueBodyMd, '背景');
              const purpose = extractSection(issueBodyMd, '目的');
              sectionWhy = [bg, purpose].filter(Boolean).join('\n\n') || sectionWhy;

              const scope = extractSection(issueBodyMd, 'スコープ（本イシュー）')
                || extractSection(issueBodyMd, 'スコープ');
              if (scope) {
                sectionWhat = scope + '\n\n**変更ファイル:**\n\n' + sectionWhat;
              }

              const acceptance = extractSection(issueBodyMd, '受け入れ条件');
              sectionEffect = purpose || acceptance || sectionEffect;
              if (acceptance && purpose) {
                sectionEffect = purpose + '\n\n**受け入れ条件:**\n\n' + acceptance;
              }
            }

            if (taskPlanPath && fs.existsSync(taskPlanPath)) {
              const plan = fs.readFileSync(taskPlanPath, 'utf8');
              const impl = extractSection(plan, '実装手順') || extractSection(plan, '概要');
              if (impl && !issueBodyMd) sectionWhy = extractSection(plan, '概要') || sectionWhy;
              if (impl) sectionWhat = impl + '\n\n**変更ファイル:**\n\n' + sectionWhat;
            }

            const issueBodyBlobUrl = fs.existsSync(issueBodyPath)
              ? `${repoUrl}/blob/${branch}/${issueBodyPath}`
              : '';

            const checklist = [];
            if (issueNum) {
              checklist.push(
                `- [x] **Issue 連携** — Fixes #${issueNum}（[Issue #${issueNum}](${issueHtmlUrl})）`,
              );
              if (issueBodyBlobUrl) {
                checklist.push(
                  `- [x] **Issue 本文** — [${issueBodyPath}](${issueBodyBlobUrl})`,
                );
              }
            }
            checklist.push(
              '- [ ] **CI** — PR の Checks タブですべて green',
              '- [ ] **レビュー依頼** — 内容を確認し、レビュアーを指定',
              '- [ ] **（該当時）手元確認** — デプロイ・Secrets・シミュレータ等、人間のみ可能な作業',
            );

            const templatePath = '.github/pull_request_template.md';
            let template = fs.existsSync(templatePath)
              ? fs.readFileSync(templatePath, 'utf8')
              : '';

            const fixesLine = issueNum ? `Fixes #${issueNum}` : '';
            template = template
              .replace(/^Fixes #<!-- AUTO_FIXES_ISSUE -->\n?/m, fixesLine ? `${fixesLine}\n\n` : '')
              .replace('<!-- AUTO_WHY -->', sectionWhy)
              .replace('<!-- AUTO_WHAT -->', sectionWhat)
              .replace('<!-- AUTO_EFFECT -->', sectionEffect)
              .replace('<!-- AUTO_ISSUE_REF -->', issueNum
                ? `- Issue: [#${issueNum}](${issueHtmlUrl})${issueBodyBlobUrl ? `\n- Issue 本文（リポジトリ）: [${issueBodyPath}](${issueBodyBlobUrl})` : ''}`
                : '- （本 PR は Issue なし — `issue-body-{slug}.md` が無いブランチ）')
              .replace('<!-- AUTO_USER_CHECKLIST -->', checklist.join('\n'));

            const title = issueNum
              ? `${issueTitle} (#${issueNum})`
              : issueTitle;

            const body = [
              `<!-- 自動 PR: \`${branch}\` ([Actions run](${runUrl})) -->`,
              '',
              template,
            ].join('\n');

            const needsSync = (pr) => {
              if (pr.title.startsWith('[auto]')) return true;
              if (!pr.body || !pr.body.includes('ユーザーがやるべきこと')) return true;
              if (issueNum && !pr.body.includes(`Fixes #${issueNum}`)) return true;
              if (issueNum && issueHtmlUrl && !pr.body.includes(issueHtmlUrl)) return true;
              if (pr.body.includes('Fixes #<!--') || pr.body.includes('Fixes #\n')) return true;
              if (pr.body.includes('<!-- AUTO_WHY -->')) return true;
              if (sectionWhy && pr.body.includes('（issue-body 未配置）') && issueBodyMd) return true;
              if (pr.body.includes('**Issue 連携** — 先頭の `Fixes #n`')) return true;
              if (pr.body.includes('**説明文** — 「なぜ / 何が / どうなる」')) return true;
              return false;
            };

            const { data: existing } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${branch}`,
              state: 'open',
              per_page: 10,
            });

            try {
              if (existing.length > 0) {
                const pr = existing[0];
                if (!needsSync(pr)) {
                  core.info(`Open PR #${pr.number} is already up to date`);
                  return;
                }
                await github.rest.pulls.update({
                  owner,
                  repo,
                  pull_number: pr.number,
                  title,
                  body,
                });
                core.info(`Updated PR #${pr.number}: ${pr.html_url}`);
                return;
              }

              const { data: pr } = await github.rest.pulls.create({
                owner,
                repo,
                title,
                head: branch,
                base,
                body,
                draft: false,
              });
              core.info(`Created PR #${pr.number}: ${pr.html_url}`);
            } catch (err) {
              const detail = err.response?.data ? JSON.stringify(err.response.data) : err.message;
              core.setFailed(`pulls API failed: ${detail}`);
            }
