# main 以外への push で PR を自動作成（既存 PR はテンプレートを同期）
name: Auto open PR

on:
  push:
    branches-ignore:
      - main
      - master
      - "dependabot/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create or sync PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const branch = context.ref.replace('refs/heads/', '');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = context.payload.repository.default_branch || 'main';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const branchSlug = branch.includes('/')
              ? branch.split('/').slice(1).join('-')
              : branch;
            const issueBodyPath = `docs/tasks/issue-body-${branchSlug}.md`;

            let issueNum = null;
            if (fs.existsSync(issueBodyPath)) {
              const issueBody = fs.readFileSync(issueBodyPath, 'utf8');
              const titleMatch = issueBody.match(/^#\s+Issue:\s*(.+)/m);
              const searchTitle = titleMatch ? titleMatch[1].trim() : branchSlug.replace(/-/g, ' ');
              const { data: issues } = await github.rest.issues.listForRepo({
                owner, repo, state: 'open', per_page: 100,
              });
              const hit = issues.find(
                (i) => !i.pull_request && (
                  i.title.includes(searchTitle)
                  || i.title.includes(branchSlug.replace(/-/g, ' '))
                ),
              );
              if (hit) issueNum = hit.number;
            }

            const checklist = [];
            if (issueNum) {
              checklist.push(
                `- [x] **Issue 連携** — \`Fixes #${issueNum}\` を自動設定済み（マージで Issue がクローズされます）`,
              );
            } else {
              checklist.push(
                '- [ ] **Issue 連携** — 先頭の `Fixes #n` を記入するか、[Issue を作成](https://github.com/' + owner + '/' + repo + '/issues/new/choose)',
              );
            }
            checklist.push(
              '- [ ] **説明文** — 「なぜ / 何が / どうなる」の3セクションを埋める',
              '- [ ] **CI** — PR の Checks タブですべて green',
              '- [ ] **レビュー依頼** — 内容を確認し、レビュアーを指定',
              '- [ ] **（該当時）手元確認** — シミュレータ / API / スクリプトの動作確認',
            );
            if (fs.existsSync(issueBodyPath)) {
              checklist.push('- [ ] **Issue 本文** — `docs/tasks/issue-body-' + branchSlug + '.md` と実装が一致しているか');
            }

            const templatePath = '.github/pull_request_template.md';
            let template = fs.existsSync(templatePath)
              ? fs.readFileSync(templatePath, 'utf8')
              : '## 概要\n\n-';

            template = template
              .replace('Fixes #<!-- AUTO_FIXES_ISSUE -->', issueNum ? `Fixes #${issueNum}` : 'Fixes #<!-- 番号を記入 -->')
              .replace('<!-- AUTO_USER_CHECKLIST -->', checklist.join('\n'));

            const title = issueNum
              ? `feat: ${branchSlug.replace(/-/g, ' ')} (#${issueNum})`
              : `feat: ${branchSlug.replace(/-/g, ' ')}`;

            const body = [
              `<!-- 自動 PR: \`${branch}\` ([Actions run](${runUrl})) -->`,
              '',
              template,
            ].join('\n');

            const needsSync = (pr) => {
              if (pr.title.startsWith('[auto]')) return true;
              if (!pr.body || !pr.body.includes('ユーザーがやるべきこと')) return true;
              if (issueNum && !pr.body.includes(`Fixes #${issueNum}`)) return true;
              return false;
            };

            const { data: existing } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${branch}`,
              state: 'open',
              per_page: 10,
            });

            try {
              if (existing.length > 0) {
                const pr = existing[0];
                if (!needsSync(pr)) {
                  core.info(`Open PR #${pr.number} is already up to date`);
                  return;
                }
                await github.rest.pulls.update({
                  owner,
                  repo,
                  pull_number: pr.number,
                  title,
                  body,
                });
                core.info(`Updated PR #${pr.number}: ${pr.html_url}`);
                return;
              }

              const { data: pr } = await github.rest.pulls.create({
                owner,
                repo,
                title,
                head: branch,
                base,
                body,
                draft: false,
              });
              core.info(`Created PR #${pr.number}: ${pr.html_url}`);
            } catch (err) {
              const detail = err.response?.data ? JSON.stringify(err.response.data) : err.message;
              core.setFailed(`pulls API failed: ${detail}`);
            }
