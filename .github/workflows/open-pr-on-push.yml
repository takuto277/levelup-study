# main 以外への push で、まだ PR が無ければドラフト PR を自動作成する
name: Auto open draft PR

on:
  push:
    branches-ignore:
      - main
      - master
      - "dependabot/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create draft PR if none exists
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          set -x

          if gh pr view --repo "$REPO" "$BRANCH_NAME" >/dev/null 2>&1; then
            echo "PR already exists for $BRANCH_NAME"
            exit 0
          fi

          gh pr create --repo "$REPO" \
            --base main \
            --head "$BRANCH_NAME" \
            --draft \
            --title "feat: asset ingestion pipeline (#2)" \
            --body "$(cat <<EOF
Fixes #2

## Summary
- apps/mobile/assets/ を正本とする入稿パイプライン

## Test plan
- [ ] validate_assets.py
- [ ] CI green
EOF
)"
