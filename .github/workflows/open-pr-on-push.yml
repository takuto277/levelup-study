# main 以外への push で、まだ PR が無ければドラフト PR を自動作成する
# ブランチ feat/{slug} かつ docs/tasks/issue-body-{slug}.md がある場合は Issue も自動起票
name: Auto open draft PR

on:
  push:
    branches-ignore:
      - main
      - master
      - "dependabot/**"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create draft PR if none exists
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = context.payload.repository.default_branch || 'main';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const fs = require('fs');

            const branchSlug = branch.includes('/')
              ? branch.split('/').slice(1).join('-')
              : branch;
            const issueBodyPath = `docs/tasks/issue-body-${branchSlug}.md`;

            let issueNumber = null;
            if (fs.existsSync(issueBodyPath)) {
              const issueBody = fs.readFileSync(issueBodyPath, 'utf8');
              const titleMatch = issueBody.match(/^#\s+(.+)/m);
              const rawTitle = titleMatch
                ? titleMatch[1].replace(/^Issue:\s*/i, '').trim()
                : branchSlug.replace(/-/g, ' ');
              const issueTitle = rawTitle.startsWith('feat:') ? rawTitle : `feat: ${rawTitle}`;

              try {
                const { data: issues } = await github.rest.issues.listForRepo({
                  owner,
                  repo,
                  state: 'open',
                  per_page: 100,
                });
                const found = issues.find(
                  (i) => !i.pull_request && (i.title === issueTitle || i.title.includes(rawTitle)),
                );
                if (found) {
                  issueNumber = found.number;
                  core.info(`Issue already exists: #${issueNumber}`);
                } else {
                  const { data: issue } = await github.rest.issues.create({
                    owner,
                    repo,
                    title: issueTitle,
                    body: issueBody,
                    labels: ['enhancement'],
                  });
                  issueNumber = issue.number;
                  core.info(`Created issue #${issueNumber}`);
                }
              } catch (err) {
                core.warning(`Issue step skipped: ${err.message}`);
              }
            }

            const { data: existing } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${branch}`,
              state: 'open',
              per_page: 30,
            });

            if (existing.length > 0) {
              core.info(`Open PR already exists for head=${branch} — skipping.`);
              return;
            }

            const title = issueNumber
              ? `feat: ${branchSlug.replace(/-/g, ' ')} (#${issueNumber})`
              : `[auto] ${branch.replace(/\//g, '_')}`;

            const bodyLines = [
              issueNumber ? `Fixes #${issueNumber}` : '',
              '',
              `このドラフト PR は \`${branch}\` への push から [Actions run](${runUrl}) で自動作成されました。`,
              '',
              '## Summary',
              '- `apps/mobile/assets/` を正本とする入稿パイプライン（manifest / sync / validate / CI）',
              '- 機能開発 Skill + assets Rule + `scripts/feature-start.sh`',
              '',
              '## Test plan',
              '- [ ] `./scripts/assets/run.sh scripts/assets/validate_assets.py`',
              '- [ ] CI: Asset pipeline validation / Mobile CI',
            ].filter((line, i, arr) => !(line === '' && arr[i + 1] === '')).join('\n');

            try {
              await github.rest.pulls.create({
                owner,
                repo,
                title,
                head: branch,
                base,
                body: bodyLines,
                draft: true,
              });
            } catch (err) {
              core.error(`pulls.create failed: ${err.message}`);
              core.error('Settings → Actions → General → Workflow permissions を Read and write にしてください。');
              throw err;
            }
