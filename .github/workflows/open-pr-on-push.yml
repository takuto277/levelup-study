# main 以外への push で、まだ PR が無ければドラフト PR を自動作成する
name: Auto open draft PR

on:
  push:
    branches-ignore:
      - main
      - master
      - "dependabot/**"

permissions:
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft PR if none exists
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = context.payload.repository.default_branch || 'main';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const { data: existing } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${branch}`,
              state: 'open',
              per_page: 30,
            });

            if (existing.length > 0) {
              core.info(`Open PR already exists for head=${branch} — skipping.`);
              return;
            }

            const title = `[auto] ${branch.replace(/\//g, '_')}`;
            const body = [
              `このドラフト PR は \`${branch}\` への push から [Actions run](${runUrl}) で自動作成されました。`,
              '',
              '- タイトル・説明を編集してから Ready for review にしてください。',
              '- イシューがある場合は本文に `Fixes #番号` を追記してください。',
            ].join('\n');

            await github.rest.pulls.create({
              owner,
              repo,
              title,
              head: branch,
              base,
              body,
              draft: true,
            });
