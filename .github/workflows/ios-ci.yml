# iOS SwiftLint + KMP iOS リンク（PR / push 時）
# CI smoke: chore/ci-smoke-test
name: iOS — CI

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/iosApp/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "apps/mobile/iosApp/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile/iosApp
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint Swift sources
        run: swiftlint lint --config .swiftlint.yml --no-cache

  ios-simulator-build:
    name: Xcode build (Simulator)
    # objectVersion 77 は Xcode 15 では開けない（ローカル Xcode 26 相当）
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: local.properties (CI placeholder)
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK" || { echo "Android SDK not found" >&2; exit 1; }
          {
            echo "sdk.dir=$SDK"
            echo "api.key=ci-placeholder-not-for-production"
          } > local.properties

      - name: Build KMP Shared (iOS Simulator)
        env:
          GRADLE_OPTS: -Xmx3g -Dorg.gradle.daemon=false -Dorg.gradle.configuration-cache=false
          LEVELUP_API_KEY: ci-placeholder-not-for-production
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --no-daemon --stacktrace

      - name: Xcode build (Simulator — Swift 型チェック)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO
