name: Bug Report
description: 不具合・想定外の動作を報告する
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        再現手順と期待する動作を書いてください（スクリーンショット・ログがあると助かります）。
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 何が起きたか（1〜3文）
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 再現手順
      description: 番号付きで具体的に
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 環境
      description: OS / アプリバージョン / API（ローカル or Render）など
    validations:
      required: false
