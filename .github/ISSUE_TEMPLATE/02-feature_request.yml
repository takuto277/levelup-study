name: Feature Request
description: 機能追加・改善の提案
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        解決したい課題と、あると嬉しい動作を書いてください。
  - type: textarea
    id: problem
    attributes:
      label: 課題・背景
      description: なぜこの変更が欲しいか
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案内容
      description: どう動いてほしいか（箇条書きで可）
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 対象（任意）
      description: mobile / backend / 両方 など
    validations:
      required: false
