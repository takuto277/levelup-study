openapi: 3.0.3
info:
  title: LevelUp Study API
  version: 0.1.0
  description: |
    HTTP API contract for the LevelUp Study Go backend.

    The router source of truth is backend/internal/router/router.go.
    API Key authentication is skipped only when DEV_MODE is enabled.
servers:
  - url: https://levelup-study-api.onrender.com
    description: Production
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Health
  - name: Users
  - name: Study
  - name: Characters
  - name: Weapons
  - name: Party
  - name: Dungeons
  - name: Gacha
  - name: Master
  - name: Debug

paths:
  /:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Health check
      security: []
      responses:
        "200":
          description: API is running.
          content:
            text/plain:
              schema:
                type: string

  /api/v1/users:
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/users/{userID}:
    parameters:
      - $ref: "#/components/parameters/UserIDPath"
    get:
      tags: [Users]
      operationId: getUser
      summary: Get a user
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        "200":
          description: User.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Users]
      operationId: updateUser
      summary: Update a user
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Delete a user
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        "200":
          description: User deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/debug/users/{userID}/currencies:
    parameters:
      - $ref: "#/components/parameters/UserIDPath"
    post:
      tags: [Debug]
      operationId: debugPatchCurrencies
      summary: Patch user currencies in DEV_MODE
      description: This route is registered only when DEV_MODE is enabled.
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DebugPatchCurrenciesRequest"
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/users/{userID}/study/complete:
    parameters:
      - $ref: "#/components/parameters/UserIDPath"
    post:
      tags: [Study]
      operationId: completeStudy
      summary: Complete a study session and grant rewards
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteStudyRequest"
      responses:
        "200":
          description: Study session completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteStudyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/users/{userID}/study/sessions:
    parameters:
      - $ref: "#/components/parameters/UserIDPath"
    get:
      tags: [Study]
      operationId: listStudySessions
      summary: List study sessions
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/OffsetQuery"
      responses:
        "200":
          description: Study sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySessionsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/users/{userID}/characters:
    parameters:
      - $ref: "#/components/parameters/UserIDPath"
    get:
      tags: [Characters]
      operationId: listUserCharacters
      summary: List owned characters
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        "200":
          description: Owned characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCharactersResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/users/{userID}/characters/{characterID}:
    parameters:
      - $ref: "#/components/parameters/UserIDPath"
      - $ref: "#/components/parameters/CharacterIDPath"
    get:
      tags: [Characters]
      operationId: getUserCharacter
      summary: Get an owned character
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        "200":
          description: Owned character.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCharacter"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/users/{userID}/characters/{characterID}/equip:
    parameters:
      - $ref: "#/components/parameters/UserIDPath"
      - $ref: "#/components/parameters/CharacterIDPath"
    put:
      tags: [Characters]
      operationId: equipWeapon
      summary: Equip or unequip a weapon
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipWeaponRequest"
      responses:
        "200":
          description: Weapon equipped or unequipped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/users/{userID}/characters/{characterID}/level-up:
    parameters:
      - $ref: "#/components/parameters/UserIDPath"
      - $ref: "#/components/parameters/CharacterIDPath"
    post:
      tags: [Characters]
      operationId: levelUpCharacter
      summary: Level up an owned character
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        "200":
          description: Updated owned character.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCharacter"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/users/{userID}/weapons:
    parameters:
      - $ref: "#/components/parameters/UserIDPath"
    get:
      tags: [Weapons]
      operationId: listUserWeapons
      summary: List owned weapons
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        "200":
          description: Owned weapons.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserWeaponsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/users/{userID}/weapons/{weaponID}/level-up:
    parameters:
      - $ref: "#/components/parameters/UserIDPath"
      - $ref: "#/components/parameters/WeaponIDPath"
    post:
      tags: [Weapons]
      operationId: levelUpWeapon
      summary: Level up an owned weapon
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        "200":
          description: Updated owned weapon.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserWeapon"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/users/{userID}/party:
    parameters:
      - $ref: "#/components/parameters/UserIDPath"
    get:
      tags: [Party]
      operationId: getParty
      summary: Get party slots
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        "200":
          description: Party slots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/users/{userID}/party/{slotPosition}:
    parameters:
      - $ref: "#/components/parameters/UserIDPath"
      - $ref: "#/components/parameters/SlotPositionPath"
    put:
      tags: [Party]
      operationId: updatePartySlot
      summary: Set a party slot
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePartySlotRequest"
      responses:
        "200":
          description: Updated party slot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPartySlot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Party]
      operationId: removePartySlot
      summary: Remove a party slot
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        "200":
          description: Party slot removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/users/{userID}/dungeons:
    parameters:
      - $ref: "#/components/parameters/UserIDPath"
    get:
      tags: [Dungeons]
      operationId: listDungeonProgress
      summary: List dungeon progress
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        "200":
          description: Dungeon progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DungeonProgressResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/users/{userID}/gacha/pull:
    parameters:
      - $ref: "#/components/parameters/UserIDPath"
    post:
      tags: [Gacha]
      operationId: pullGacha
      summary: Pull a gacha banner
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GachaPullRequest"
      responses:
        "200":
          description: Gacha pull result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GachaPullResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/users/{userID}/gacha/history:
    parameters:
      - $ref: "#/components/parameters/UserIDPath"
    get:
      tags: [Gacha]
      operationId: listGachaHistory
      summary: List gacha history
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/OffsetQuery"
        - $ref: "#/components/parameters/BannerIDQuery"
      responses:
        "200":
          description: Gacha history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GachaHistoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/master/characters:
    get:
      tags: [Master]
      operationId: listMasterCharacters
      summary: List character master data
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Character master data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterCharactersResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/master/weapons:
    get:
      tags: [Master]
      operationId: listMasterWeapons
      summary: List weapon master data
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Weapon master data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterWeaponsResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/master/dungeons:
    get:
      tags: [Master]
      operationId: listMasterDungeons
      summary: List dungeon master data
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Dungeon master data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterDungeonsResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/master/dungeons/{dungeonID}:
    parameters:
      - $ref: "#/components/parameters/DungeonIDPath"
    get:
      tags: [Master]
      operationId: getMasterDungeon
      summary: Get dungeon master detail
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Dungeon master detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterDungeon"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/master/gacha/banners:
    get:
      tags: [Master]
      operationId: listActiveGachaBanners
      summary: List active gacha banners
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Active gacha banners.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GachaBannersResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/master/genres:
    get:
      tags: [Master]
      operationId: listStudyGenres
      summary: List study genre master data
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Study genre master data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyGenresResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Master]
      operationId: createStudyGenre
      summary: Create a study genre
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudyGenreRequest"
      responses:
        "201":
          description: Created study genre.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterStudyGenre"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/master/genres/{genreID}:
    parameters:
      - $ref: "#/components/parameters/GenreIDPath"
    delete:
      tags: [Master]
      operationId: deleteStudyGenre
      summary: Delete a study genre
      description: Logical delete. Returns 204 when the genre is already inactive or successfully deactivated.
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        "204":
          description: Study genre deleted or already inactive.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserIDPath:
      name: userID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CharacterIDPath:
      name: characterID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WeaponIDPath:
      name: weaponID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DungeonIDPath:
      name: dungeonID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GenreIDPath:
      name: genreID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SlotPositionPath:
      name: slotPosition
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 4
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 20
    OffsetQuery:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    BannerIDQuery:
      name: banner_id
      in: query
      required: false
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Missing or invalid API key, or access to another user's resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    CreateUserRequest:
      type: object
      required: [display_name]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 50

    UpdateUserRequest:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 50
        selected_dungeon_id:
          type: string
          nullable: true
          pattern: "^$|^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
          description: UUID string to select a dungeon. Empty string or null clears the selection.

    DebugPatchCurrenciesRequest:
      type: object
      properties:
        stones_delta:
          type: integer
        gold_delta:
          type: integer
      description: At least one of stones_delta or gold_delta must be non-zero.

    User:
      type: object
      required:
        - id
        - display_name
        - total_study_seconds
        - stones
        - gold
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        total_study_seconds:
          type: integer
          format: int64
        stones:
          type: integer
        gold:
          type: integer
        selected_dungeon_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CompleteStudyRequest:
      type: object
