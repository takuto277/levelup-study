          type: string
          format: uuid
          nullable: true
        defeat_normal_count:
          type: integer
          minimum: 0
          default: 0
        defeat_boss_count:
          type: integer
          minimum: 0
          default: 0
        difficulty_multiplier:
          type: number
          format: double
          default: 1
