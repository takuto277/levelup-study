# backend/db/seed.sql の m_monsters.slug → バンドル sprite key
monster_slug_to_sprite_key:
  forest_slime: slime
  crystal_slime: slime
  fire_slime: slime
  rust_monster: slime
  goblin: goblin
  bat: bat
  cave_bat: bat
  werewolf: werewolf
  treant: treant
  golem: golem
  lava_golem: golem
  dark_miner: goblin
  dragon: dragon
  stone_sentinel: stone_sentinel
  lizardman: lizardman
  dark_knight: dark_knight
  cerberus: cerberus
  crimson_demon: crimson_demon
  specter: specter
  mimic: mimic
  nightmare: nightmare
  corrupted_paladin: corrupted_paladin
  wisp: wisp
  phoenix: phoenix
  thunderbird: thunderbird
  forgotten_tome: lich
  ink_wraith: specter
  lich: lich
  gargoyle: gargoyle
  abyssal_serpent: abyssal_serpent

# マスタ画像（CDN / image_url）— 同梱バトルスプライトとは別系統
master_images:
  character_portrait:
    table: m_characters
    column: image_url
    recommended_px: "512x512"
    local_dir: master/characters
    note: "開発中は placehold.co。本番は R2 等に配置し seed/API を更新"
  weapon_icon:
    table: m_weapons
    column: image_url
    recommended_px: "256x256"
    local_dir: master/weapons
  dungeon_banner:
    table: m_dungeons
    column: image_url
    recommended_px: "800x400"
    local_dir: master/dungeons
    fallback: "空ならクライアントは bg_dungeon_{dungeon_key} 同梱画像を使用"

# OS 固有アセット（source/manifest 管理外）
# これらは sync の入出力対象外。validate の orphan 検出からも除外。
os_specific_assets:
  note: "OS 固有またはビルドシステムが管理するアセット。source/manifest の管理対象外。"
  android:
    - "ic_launcher_background.xml"
    - "ic_launcher_foreground.xml"
    - "ic_launcher.png"
    - "ic_launcher_round.png"
    - "ic_launcher.xml"
    - "ic_launcher_round.xml"
    - "Contents.json"
  ios:
    - "AppIcon.appiconset"
    - "AccentColor.colorset"
    - "Contents.json"
