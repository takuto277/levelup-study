version: 1

# LevelUp Study — ゲームアセット正本マニフェスト
# 入稿: apps/mobile/assets/source/ に PNG を置き、本ファイルを更新 → sync → validate → PR
# 詳細: docs/assets/01_Asset_Ingestion_Workflow.md

battle_assets:
  # --- プレイヤー ---
  - file: sprite_player_idle_1.png
    kind: player
    mode: idle
    frame: 1
    required: false
  - file: sprite_player_idle_2.png
    kind: player
    mode: idle
    frame: 2
    required: false
  - file: sprite_player_walk_1.png
    kind: player
    mode: walk
    frame: 1
    required: false
  - file: sprite_player_walk_2.png
    kind: player
    mode: walk
    frame: 2
    required: false
  - file: sprite_player_attack_1.png
    kind: player
    mode: attack
    frame: 1
    required: false
  - file: sprite_player_attack_2.png
    kind: player
    mode: attack
    frame: 2
    required: false
  - file: sprite_player_attack_3.png
    kind: player
    mode: attack
    frame: 3
    required: false
  - file: sprite_player_attack_4.png
    kind: player
    mode: attack
    frame: 4
    required: false
  - file: sprite_player_attack_5.png
    kind: player
    mode: attack
    frame: 5
    required: false
  - file: sprite_player_prep_1.png
    kind: player
    mode: prep
    frame: 1
    required: false
  - file: sprite_player_prep_2.png
    kind: player
    mode: prep
    frame: 2
    required: false
  - file: sprite_player_rest_1.png
    kind: player
    mode: rest
    frame: 1
    required: true

  # --- 背景（bg_dungeon_{dungeon_key}.png） ---
  - file: bg_dungeon_training.png
    kind: background
    dungeon_key: training
    required: true
  - file: bg_dungeon_default.png
    kind: background
    dungeon_key: default
    required: false
  - file: bg_dungeon_forest.png
    kind: background
    dungeon_key: forest
    required: false
  - file: bg_dungeon_cave.png
    kind: background
    dungeon_key: cave
    required: false
  - file: bg_dungeon_tower.png
    kind: background
    dungeon_key: tower
    required: false

  # --- 小物 ---
  - file: prop_training_barrel.png
    kind: prop
    prop_key: training_barrel
    required: true

  # --- ガチャ ---
  - file: bg_gacha_banner.png
    kind: gacha_banner
    required: true

# 敵スプライト: sprite_enemy_{key}_{frame}.png
# key はバンドル内のスプライトキー。monster_slug_to_sprite_key で DB slug と対応付け。
# この一覧が EnemySpriteAssets.kt の bundledKeys の正本。追加時は generate で Kotlin へ反映。
enemy_sprite_keys:
  - slime
  - goblin
  - bat
  - skeleton
  - dragon
  - orc
  - golem
  - lich
  - wyvern
  - minotaur
  - mandrake
  - griffin
  - basilisk
  - cerberus
  - kraken
  - hydra
  - leviathan
  - banshee
  - wisp
  - imp
  - succubus
  - dullahan
  - gargoyle
  - specter
  - mummy
  - troll
  - kobold
  - lamia
  - crimson_demon
  - shadow_knight
  - harpy
  - centaur
  - dryad
  - naga
  - ogre
  - cyclops
  - ghoul
  - wraith
  - frost_giant
  - sand_worm
  - cockatrice
  - werewolf
  - vampire
  - zombie
  - lizardman
  - dark_knight
  - rust_monster
  - bone_dragon
  - nightmare
  - pirate_wraith
